[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[project]
name = "pangaea"
version = "2.0.0"
description = "Benchmark for Geospatial Foundation Models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Pangaea Bench Team" }]
keywords = ["geospatial", "foundation-models", "benchmark", "remote-sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "albumentations>=2.0.8",
    "einops>=0.8.2",
    "gdown>=6.0.0",
    "geopandas>=1.1.3",
    "google-cloud-storage>=3.10.1",
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.9",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
    "ptflops>=0.7.5",
    "pyarrow>=24.0.0",
    "pydataverse>=0.3.5",
    "rasterio>=1.4.4",
    "rioxarray>=0.19.0",
    "scikit-learn>=1.8.0",
    "tacoreader>=2.4.21",
    "tensorboard>=2.20.0",
    "tifffile>=2026.3.3",
    "timm>=1.0.26",
    "torch>=2.1.0",
    "torchmetrics[detection]>=1.0",
    "torchvision>=0.16.0",
    "tqdm>=4.67.3",
    "wandb>=0.26.1",
    "wandb-osh>=1.2.2",
    "yacs>=0.1.8",
]

[project.urls]
Homepage = "https://github.com/Evameijling/pangaea-bench2.0"
Repository = "https://github.com/Evameijling/pangaea-bench2.0"
Issues = "https://github.com/Evameijling/pangaea-bench2.0/issues"

[tool.uv.build-backend]
module-name = "pangaea"
module-root = ""
source-include = ["configs/**", "tests/**"]

[tool.ruff.lint]
# flake8 config: only enforce real-bug rules
# (syntax errors and undefined names). Matches:
#   flake8 . --select=E9,F63,F7,F82
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.14",
]
