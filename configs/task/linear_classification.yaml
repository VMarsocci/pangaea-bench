trainer:
  _target_: pangaea.engine.trainer.LinearClassificationTrainer
  # params overwritten in run
  model: null
  train_loader: null
  optimizer: null
  lr_scheduler: null
  evaluator: null
  exp_dir: null
  device: null
  criterion: null

  # params to adapt
  n_epochs: 50
  precision: fp32
  ckpt_interval: 50
  eval_interval: 5
  log_interval: 5
  best_metric_key: accuracy
  use_wandb: ${use_wandb}
  wandb_offline: ${wandb_offline}
  wandb_offline_sync_communication_dir: ${wandb_offline_sync_communication_dir}

evaluator:
  _target_: pangaea.engine.evaluator.LinearClassificationEvaluator
  # params overwritten in run
  val_loader: null
  exp_dir: null
  device: null
  use_wandb: ${use_wandb}
  wandb_offline: ${wandb_offline}
  wandb_offline_sync_communication_dir: ${wandb_offline_sync_communication_dir}
  inference_mode: null
  sliding_inference_batch: null
  # visualization — overridden at test time via test.yaml or CLI
  save_predictions: false
  save_visualizations: false
  save_output_dir: null
  max_samples_to_visualize: -1
  overwrite: true
  rgb_bands: [2, 1, 0]